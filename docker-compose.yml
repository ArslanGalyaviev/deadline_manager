version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: deadline_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deadline_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: deadline_web
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/deadline_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
